server:
  port: 8081

spring:
  application:
    name: registry

  datasource:
    url: jdbc:postgresql://localhost:5432/exampledb
    username: example
    password: example
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
